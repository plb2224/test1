<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MS Electricals - Admin Panel</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 15px; background: #f4f4f9; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { color: #333; margin-top: 0; }
        .section { margin-bottom: 20px; padding: 15px; border: 1px solid #ddd; border-radius: 5px; background: #fafafa; }
        input, button { padding: 10px; margin: 6px 0; width: 100%; box-sizing: border-box; font-size: 14px; }
        button { background: #007BFF; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
        .delete-btn { background: #dc3545; width: auto; padding: 5px 10px; font-size: 12px; }
        .delete-btn:hover { background: #bd2130; }
        ul { list-style: none; padding: 0; margin-top: 10px; }
        li { background: #fff; margin-top: 5px; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #eee; border-radius: 4px; }
        #syncStatus { font-size: 13px; font-weight: bold; color: green; float: right; }
    </style>
</head>
<body>

<div class="container">
    <h2>Admin Panel <span id="syncStatus">Synced ✓</span></h2>
    
    <!-- Cloud URL Setup Section -->
    <div class="section">
        <h3>Google Cloud URL Setup</h3>
        <input type="text" id="cloudUrlInput" placeholder="Yahan apna /exec wala URL dalein">
        <button onclick="saveCloudUrl()">Save Cloud URL</button>
    </div>

    <!-- Supervisor Management Section -->
    <div class="section">
        <h3>Manage Supervisors</h3>
        <input type="text" id="supId" placeholder="Supervisor ID">
        <input type="text" id="supPass" placeholder="Password">
        <button onclick="handleAddNewSupervisor()">Add Supervisor</button>
        <ul id="supList"></ul>
    </div>

    <!-- Labour Management Section -->
    <div class="section">
        <h3>Manage Labours</h3>
        <input type="text" id="labEmpId" placeholder="Employee ID">
        <input type="text" id="labName" placeholder="Labour Name">
        <button onclick="handleAddNewLabour()">Add Labour</button>
        <ul id="labList"></ul>
    </div>
</div>

<script>
    var supervisors = JSON.parse(localStorage.getItem("supervisors")) || [];
    var labours = JSON.parse(localStorage.getItem("labours")) || [];

    // App khulte hi cloud se data load karne ke liye
    window.onload = function() {
        var savedUrl = localStorage.getItem("cloudUrl");
        if (savedUrl) {
            document.getElementById("cloudUrlInput").value = savedUrl;
            loadDataFromCloud();
        }
        renderLists();
    };

    // Cloud URL Save karne ka function
    function saveCloudUrl() {
        var url = document.getElementById("cloudUrlInput").value.trim();
        if (url) {
            localStorage.setItem("cloudUrl", url);
            alert("Cloud URL successfully save ho gaya!");
            loadDataFromCloud();
        } else {
            alert("Kripya sahi URL dalein!");
        }
    }

    // Google Sheet se data fetch karne ka function
    function loadDataFromCloud() {
        var cloudUrl = localStorage.getItem("cloudUrl");
        if (!cloudUrl) return;

        fetch(cloudUrl + "?action=getAllData")
            .then(response => response.json())
            .then(data => {
                if(data.supervisors && data.labours) {
                    supervisors = data.supervisors;
                    labours = data.labours;
                    
                    localStorage.setItem("supervisors", JSON.stringify(supervisors));
                    localStorage.setItem("labours", JSON.stringify(labours));
                    
                    renderLists();
                    console.log("Cloud se latest data load ho gaya!");
                }
            })
            .catch(err => console.log("Auto-load failed:", err));
    }

    // Background mein automatic data Google Sheet par bhejne ke liye (Auto-Sync)
    function autoSyncToCloud() {
        var cloudUrl = localStorage.getItem("cloudUrl");
        if (!cloudUrl) return;

        var statusSpan = document.getElementById("syncStatus");
        if(statusSpan) {
            statusSpan.innerText = "Saving...";
            statusSpan.style.color = "orange";
        }

        var payload = {
            supervisors: supervisors,
            labours: labours
        };

        fetch(cloudUrl, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(payload)
        }).then(() => {
            if(statusSpan) {
                statusSpan.innerText = "Synced ✓";
                statusSpan.style.color = "green";
            }
        }).catch((err) => {
            if(statusSpan) {
                statusSpan.innerText = "Sync Failed ❌";
                statusSpan.style.color = "red";
            }
        });
    }

    // Screen par list dikhane aur update karne ke liye
    function renderLists() {
        var supListHtml = "";
        supervisors.forEach(sup => {
            supListHtml += `<li><span>ID: <b>${sup.id}</b> (Pass: ${sup.pass})</span> <button class="delete-btn" onclick="removeSupervisor('${sup.id}')">Delete</button></li>`;
        });
        document.getElementById("supList").innerHTML = supListHtml;

        var labListHtml = "";
        labours.forEach(lab => {
            labListHtml += `<li><span>ID: <b>${lab.empId}</b> - Name: ${lab.name}</span> <button class="delete-btn" onclick="removeLabour('${lab.empId}')">Delete</button></li>`;
        });
        document.getElementById("labList").innerHTML = labListHtml;
    }

    // Naya Supervisor Add karne ka function (Duplicate check ke sath)
    function handleAddNewSupervisor() {
        var id = document.getElementById("supId").value.trim();
        var pass = document.getElementById("supPass").value.trim();

        if(!id || !pass) {
            alert("Kripya ID aur Password dono bharein!");
            return;
        }

        let exists = supervisors.some(sup => sup.id === id);
        if(exists) {
            alert("Yeh Supervisor ID pehle se maujood hai!");
            return;
        }
        
        supervisors.push({ id: id, pass: pass });
        localStorage.setItem("supervisors", JSON.stringify(supervisors));
        autoSyncToCloud();
        renderLists();

        document.getElementById("supId").value = "";
        document.getElementById("supPass").value = "";
    }

    // Supervisor Delete karne ka function
    function removeSupervisor(id) {
        supervisors = supervisors.filter(sup => sup.id !== id);
        localStorage.setItem("supervisors", JSON.stringify(supervisors));
        autoSyncToCloud();
        renderLists();
    }

    // Naya Labour Add karne ka function (Duplicate check ke sath)
    function handleAddNewLabour() {
        var empId = document.getElementById("labEmpId").value.trim();
        var name = document.getElementById("labName").value.trim();

        if(!empId || !name) {
            alert("Kripya Employee ID aur Name dono bharein!");
            return;
        }

        let exists = labours.some(lab => lab.empId === empId);
        if(exists) {
            alert("Yeh Labour ID pehle se maujood hai!");
            return;
        }
        
        labours.push({ empId: empId, name: name });
        localStorage.setItem("labours", JSON.stringify(labours));
        autoSyncToCloud();
        renderLists();

        document.getElementById("labEmpId").value = "";
        document.getElementById("labName").value = "";
    }

    // Labour Delete karne ka function
    function removeLabour(empId) {
        labours = labours.filter(lab => lab.empId !== empId);
        localStorage.setItem("labours", JSON.stringify(labours));
        autoSyncToCloud();
        renderLists();
    }
</script>

</body>
</html>
